name: Windows quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  quality:
    name: Quality policy
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Start job timer
        shell: pwsh
        run: '"JOB_STARTED_AT=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV'
      - name: Check out candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.108
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0
          cache: npm
      - name: Install locked quality tools
        run: npm ci --ignore-scripts
      - name: Test quality result classification
        shell: pwsh
        run: pwsh -NoProfile -File scripts/tests/QualityChecks.Tests.ps1
      - name: Test required-job classification
        shell: pwsh
        run: pwsh -NoProfile -File scripts/tests/WindowsQuality.Tests.ps1
      - name: Run repository quality policy
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-quality.ps1
      - name: Publish quality duration
        if: ${{ always() }}
        shell: pwsh
        run: |
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:JOB_STARTED_AT
          "### Quality policy duration`n`n$elapsed seconds" >> $env:GITHUB_STEP_SUMMARY

  tests:
    name: Release build and tests
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Start job timer
        shell: pwsh
        run: '"JOB_STARTED_AT=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV'
      - name: Check out candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.108
      - name: Restore solution
        run: dotnet restore TickDown.sln
      - name: Build solution
        run: dotnet build TickDown.sln --configuration Release --no-restore
      - name: Test solution
        run: dotnet test TickDown.sln --configuration Release --no-build --no-restore
      - name: Publish test duration
        if: ${{ always() }}
        shell: pwsh
        run: |
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:JOB_STARTED_AT
          "### Release build and tests duration`n`n$elapsed seconds" >> $env:GITHUB_STEP_SUMMARY

  architecture:
    name: Build (${{ matrix.architecture }})
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x64
          - x86
          - ARM64
    steps:
      - name: Start job timer
        shell: pwsh
        run: '"JOB_STARTED_AT=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV'
      - name: Check out candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.108
      - name: Restore application
        env:
          BUILD_PLATFORM: ${{ matrix.architecture }}
        run: dotnet restore src/TickDown.csproj -p:Platform=$env:BUILD_PLATFORM
      - name: Build application
        env:
          BUILD_PLATFORM: ${{ matrix.architecture }}
        run: dotnet build src/TickDown.csproj --configuration Release --no-restore -p:Platform=$env:BUILD_PLATFORM
      - name: Publish architecture duration
        if: ${{ always() }}
        shell: pwsh
        run: |
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:JOB_STARTED_AT
          "### ${{ matrix.architecture }} build duration`n`n$elapsed seconds" >> $env:GITHUB_STEP_SUMMARY

  required:
    name: Required
    if: ${{ always() }}
    needs:
      - quality
      - tests
      - architecture
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require every child job
        shell: pwsh
        env:
          CHILD_RESULTS: ${{ toJSON(needs) }}
        run: |
          Import-Module ./scripts/WindowsQuality.psm1 -Force
          $rows = Assert-RequiredJobs -ResultsJson $env:CHILD_RESULTS `
            -RequiredNames @('quality', 'tests', 'architecture')
          $rows | ForEach-Object {
            "- $($_.Name): $($_.Result)" >> $env:GITHUB_STEP_SUMMARY
          }
